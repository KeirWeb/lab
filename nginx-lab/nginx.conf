worker_processes 1;
error_log logs/error.log;
pid logs/nginx.pid;

events {
    worker_connections 64;
}


http	{
	include /opt/homebrew/etc/nginx/mime.types;
	default_type application/octet-stream;

	log_format lab '$remote_addr $status $body_bytes_sent gzip=$gzip_ratio "$request"';
	access_log logs/access.log lab;

	gzip on;
	gzip_types text/plain text/html text/css application/json application/javascript;
	gzip_min_length 20;

	limit_req_zone $binary_remote_addr zone=one:10m rate=1r/s;

	map $http_origin $cors_origin {
		default "";
		http://site-c.localhost:8080  $http_origin;
		https://site-a.localhost:8443 $http_origin;

	}

	proxy_cache_path cache keys_zone=api:1m inactive=60s max_size=10m;
	proxy_temp_path cache_temp;

	server {
		listen 8080;
		server_name site-a.localhost;
		return 301 https://$host:8443$request_uri;
	}

	server {
		listen 8443 ssl;
		http2 on;
		server_name site-a.localhost;
		root html/a;
		index index.html;


		location / {
			add_header Referrer-Policy strict-origin-when-cross-origin;
			add_header Strict-Transport-Security "max-age=60";

			try_files $uri $uri/ /index.html;

		}

		ssl_certificate     certs/site-a.crt;
		ssl_certificate_key certs/site-a.key;
		ssl_session_cache shared:SSL:10m;
		ssl_session_timeout 10m;
	}

	server {
		listen 8080;
		server_name site-c.localhost;
		root html/c;
		index index.html;
	}

	server {
		listen 8080;
		server_name site-b.localhost;
		root html/b;
		index index.html;

		error_page 404 /404.html;
		error_page 502 503 /50x.html;

		location / {
			expires 30s;

			add_header X-Frame-Options DENY always;
			add_header X-Content-Type-Options nosniff;
			add_header Referrer-Policy strict-origin-when-cross-origin;
			add_header Content-Security-Policy "default-src 'self';
			img-src 'self'";


			try_files $uri $uri/ /index.html;
		}

		location ~* \.(js|css|png|jpg|svg|woff2)$ {
			try_files $uri =404;
		}

		location /api/ {
			# auth_basic "lab api";
			# auth_basic_user_file htpasswd;
			limit_req zone=one burst=2 nodelay;

			if ($request_method = OPTIONS) {
				add_header Access-Control-Allow-Origin "http://site-c.localhost:8080" always;
				add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
				add_header Access-Control-Allow-Headers "X-Lab" always;
				add_header Content-Length 0;
				add_header Content-Type text/plain;

				return 204;
			}

			proxy_pass http://api_backend/;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			add_header Referrer-Policy strict-origin-when-cross-origin;

			add_header Access-Control-Allow-Origin $cors_origin always;


			proxy_cache api;
			proxy_cache_valid 200 10s;
			add_header X-Cache-Status $upstream_cache_status;
		}

		location /ws {
		  proxy_pass http://api_backend;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_set_header Host $host;
			proxy_read_timeout 3600s;
		}
	}

	upstream api_backend {
		server 127.0.0.1:3000;
		server 127.0.0.1:3001;
	}


}