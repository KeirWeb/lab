services:
  lab-nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: lab-nginx:local
    # ports: ["8090:80"]
    ports: ["${HOST_PORT:-8090}:80"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 3

  backend:
    deploy:
      replicas: 3
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: lab-backend:local
    restart: unless-stopped

    mem_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
