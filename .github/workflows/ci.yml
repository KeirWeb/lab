name: ci

on:
  pull_request:
    paths-ignore:
      - "nginx-lab/docker-compose.prod.yml"
  push:
    branches: ["main"]
    paths-ignore:
      - "nginx-lab/docker-compose.prod.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: nginx-lab
    steps:
      - uses: actions/checkout@v5

      - name: compose config
        run: docker compose config

      - name: build
        run: docker compose build lab-nginx backend

      - name: login ghcr
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: tag and push
        if: github.event_name == 'push'
        run: |
          SHA=${GITHUB_SHA::7}
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          docker tag lab-nginx:local ghcr.io/$OWNER/lab-nginx:$SHA
          docker tag lab-backend:local ghcr.io/$OWNER/lab-backend:$SHA
          docker push ghcr.io/$OWNER/lab-nginx:$SHA
          docker push ghcr.io/$OWNER/lab-backend:$SHA
